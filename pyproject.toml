[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-member-ops"
version = "0.1.0"
description = "Member-operations MCP server: tools, resources, prompts with RBAC, masking and audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=0.10", "typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
mcpops = "mcpops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
